<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MV Command Center</title>
<style>
:root{
--bg:#07111f;--surface:#0d1b2e;--elev:#13243b;--tp:#f7f9fc;--ts:#9eb0c8;
--accent:#6c7cff;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--info:#38bdf8;
--border:rgba(255,255,255,.08);--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tp);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
body{padding-bottom:78px}
.hd{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0a1626,rgba(10,22,38,.92));backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-top))}
.hd .row{display:flex;align-items:center;gap:10px}
.brand{font-size:15px;font-weight:800;letter-spacing:.14em}
.brand .g{color:var(--accent)}
.live{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ts);margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.status{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:13px}
.stpill{padding:4px 11px;border-radius:20px;font-weight:700;font-size:12px}
.sync{color:var(--ts);font-size:11px;margin-left:auto}
.rf{background:var(--elev);border:1px solid var(--border);color:var(--tp);width:34px;height:34px;border-radius:10px;font-size:15px;cursor:pointer}
.wrap{padding:14px 16px;max-width:900px;margin:0 auto}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ts);margin:20px 2px 10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.kpi .n{font-size:30px;font-weight:800;line-height:1.05}
.kpi .l{font-size:12px;color:var(--ts);margin-top:3px}
.kpi .d{font-size:11px;margin-top:6px;color:var(--ts)}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.b-suc{background:var(--success)}.b-warn{background:var(--warning)}.b-dan{background:var(--danger)}.b-inf{background:var(--info)}.b-acc{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.att{border-left:4px solid var(--warning)}
.att.P1{border-left-color:var(--danger)}
.att .p{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;background:rgba(245,158,11,.16);color:var(--warning)}
.att.P1 .p{background:rgba(239,68,68,.16);color:var(--danger)}
.att h3{margin:8px 0 4px;font-size:15px}
.att .m{font-size:12.5px;color:var(--ts);line-height:1.5}
.att .a{margin-top:9px;font-size:12.5px;background:var(--elev);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.att .a b{color:var(--accent)}
.agc{display:flex;gap:12px;align-items:flex-start}
.av{flex:0 0 42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;background:linear-gradient(135deg,#1c2f4d,#24406b);color:#cfe0ff}
.agc .nm{font-weight:700;font-size:15px}
.agc .ro{font-size:12px;color:var(--ts)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-top:5px}
.st .d2{width:8px;height:8px;border-radius:50%}
.s-work{color:var(--success)}.s-work .d2{background:var(--success)}
.s-wait{color:var(--info)}.s-wait .d2{background:var(--info)}
.s-warn{color:var(--warning)}.s-warn .d2{background:var(--warning)}
.s-dan{color:var(--danger)}.s-dan .d2{background:var(--danger)}
.s-off{color:var(--ts)}.s-off .d2{background:var(--ts)}
.tk{font-size:12.5px;color:var(--tp);margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:11.5px;color:var(--ts);margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--surface);border:1px solid var(--border);color:var(--ts);padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px}
.bg-nx{background:rgba(108,124,255,.16);color:var(--accent)}
.bg-mv{background:rgba(56,189,248,.15);color:var(--info)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--elev);color:var(--ts)}
.pill.ok{background:rgba(34,197,94,.15);color:var(--success)}
.pill.blk{background:rgba(239,68,68,.15);color:var(--danger)}
.pill.pend{background:rgba(245,158,11,.15);color:var(--warning)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.res .c{background:var(--elev);border-radius:10px;padding:9px}.res .c .n{font-size:19px;font-weight:800}.res .c .l{font-size:11px;color:var(--ts)}
.frozen{opacity:.75;border-style:dashed}
a.lnk{color:var(--accent);text-decoration:none;font-weight:600;font-size:12.5px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,22,38,.96);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;border:0;color:var(--ts);font-size:10.5px;padding:6px 2px;cursor:pointer;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .i{font-size:18px}
.nav button.on{color:var(--accent)}
.sec{display:none}.sec.on{display:block}
.sk{background:linear-gradient(90deg,var(--surface),var(--elev),var(--surface));background-size:200% 100%;animation:sh 1.3s infinite;border-radius:var(--r);height:86px;margin-bottom:10px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.err{background:rgba(239,68,68,.12);border:1px solid var(--danger);color:#ffd7d7;border-radius:12px;padding:11px;font-size:12.5px;margin-bottom:10px;display:none}
.muted{color:var(--ts);font-size:12px}
</style></head><body>

</div>

 // media
 document.getElementById('media').innerHTML=(D.media||[]).map(m=>{
  const vp=m.voice==='BLOCKED_NO_LICENSED_VOICE'?'<span class="pill blk">głos zablokowany</span>':(m.voice?`<span class="pill">${esc(m.voice)}</span>`:'');
  const sp=/PUBLISHED/.test(m.status||'')?'ok':(/BLOCKED/.test(m.status||'')?'blk':'pend');
  return `<div class="card"><div class="row2"><span class="badge ${m.product==='NEXION'?'bg-nx':'bg-mv'}">${esc(m.product)}</span><span class="pill ${sp}">${esc(m.status)}</span></div><div class="meta" style="margin-top:8px">Format: ${esc(m.format||'—')} · Platforma: ${esc(m.platform||'—')} · QA: ${esc(m.qa??'—')} · Koszt: ${esc(m.cost??0)} zł ${m.views!=null?('· '+m.views+' wyśw.'):''}</div><div class="row2" style="margin-top:8px">${vp}${m.url?`<a class="lnk" href="${esc(m.url)}" target="_blank">Obejrzyj ↗</a>`:'<span></span>'}</div></div>`;
 }).join('')||'<div class="card muted">Brak materiałów.</div>';
 // results
 const R=`<div class="card"><div class="row2"><b>NEXION</b><span class="badge bg-nx">flagowy</span></div><div class="res"><div class="c"><div class="n">${b.nexion_published||0}</div><div class="l">materiały</div></div><div class="c"><div class="n">${b.nexion_subs||0}</div><div class="l">subskrypcje</div></div><div class="c"><div class="n">${b.smart_link_clicks||0}</div><div class="l">kliknięcia (all)</div></div><div class="c"><div class="n">0 zł</div><div class="l">MRR</div></div></div></div>`+
 `<div class="card"><div class="row2"><b>Pozostałe usługi MV</b><span class="badge bg-mv">portfolio</span></div><div class="res"><div class="c"><div class="n">${b.mv_published||0}</div><div class="l">materiały</div></div><div class="c"><div class="n">${b.consents||0}</div><div class="l">zgody/leady</div></div><div class="c"><div class="n">0</div><div class="l">oferty</div></div><div class="c"><div class="n">0 zł</div><div class="l">przychód</div></div></div></div>`+
 `<div class="card frozen"><div class="row2"><b>Recepcja AI</b><span class="pill">FROZEN</span></div><div class="muted" style="margin-top:6px">Brak aktywnych działań — wyłączona ze strategii.</div></div>`;
 document.getElementById('results').innerHTML=R;
}
// nav
document.querySelectorAll('.nav button').forEach(btn=>btn.onclick=()=>{
 document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
 document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
 document.getElementById('s-'+btn.dataset.t).classList.add('on');window.scrollTo(0,0);
});
document.getElementById('afilters').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){af=c.dataset.f;render();}});
async function refresh(){
 if(!FETCH_URL)return;
 try{const r=await fetch(FETCH_URL,{cache:'no-store'});const j=await r.json();
  if(j&&j.ok&&j.data){D=j.data;document.getElementById('err').style.display='none';render();}
  else if(j&&!j.ok){document.getElementById('err').style.display='block';document.getElementById('err').textContent='Dane: '+(j.error||'błąd')+(j.error==='invalid_or_expired'?' — poproś o świeży panel.':'');}
 }catch(e){/* keep last good data silently (app renderer blocks fetch) */}
}
document.getElementById('rf').onclick=refresh;
render(); refresh(); setInterval(refresh,45000);
</script>
</body></html>
