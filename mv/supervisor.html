<div class="msg" id="msg"><h1>MV – AI Supervisor</h1><p>Wczytywanie panelu na żywo…</p></div>
<script>
(function(){
  var FN="https://mdsvcobwuezriexyqqby.supabase.co/functions/v1/mv-sv-panel";
  var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kc3Zjb2J3dWV6cmlleHlxcWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNjMxMjMsImV4cCI6MjA5MzYzOTEyM30.o4CVcSf9drtDxlpVv11T_E3N4dd-BSTrQPRCZXfpusg";
  var k=new URLSearchParams(location.search).get("k")||"";
  if(!k){document.getElementById("msg").innerHTML="<h1>MV – AI Supervisor</h1><p>Brak tokenu. Otwórz adres z parametrem <code>?k=&lt;controller_token&gt;</code>.</p>";return;}
  fetch(FN+"?k="+encodeURIComponent(k),{headers:{authorization:"Bearer "+ANON}})

})();
</script>
